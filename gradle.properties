# Keep Gradle light on a shared desktop: two workers, no parallel project execution.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+PerfDisableSharedMem -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+PerfDisableSharedMem
kotlin.code.style=official
android.nonTransitiveRClass=true

# Keep the desktop responsive and release the daemon soon after a build.
org.gradle.priority=low
org.gradle.vfs.watch=false
org.gradle.daemon.idletimeout=60000
